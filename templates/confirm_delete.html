{% extends 'layout/base.html' %}
{% load static %}

{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
    <div>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2">
                <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
                <li class="breadcrumb-item"><a href="{% url list_url %}">Back</a></li>
                <li class="breadcrumb-item active" aria-current="page">{{ title }}</li>
            </ol>
        </nav>
        <h1 class="page-title mb-1">{{ title }}</h1>
        <p class="text-muted mb-0">This action will permanently remove the record.</p>
    </div>
</div>

<div class="section-card mb-4">
    <div class="card-body">
        <p class="mb-4">Are you sure you want to delete <strong>{{ object }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button class="btn btn-danger" type="submit">Delete</button>
                <a href="{% url list_url %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
